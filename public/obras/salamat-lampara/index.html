  // Encuadre según la forma de la pantalla, ANTES de pintar (por eso va en línea, justo
  // después de la escena): en vertical, la foto alta y la lámpara entera a lo ancho.
  // Sin JS: la foto de siempre recortada (se ve bien igual, sólo menos lámpara).
  (function () {
    var escena = document.querySelector('.escena[data-vertical]');
    if (!escena) return;
    var v = JSON.parse(escena.dataset.vertical);
    var svg = escena.querySelector('.escena__pared');
    var rotulos = escena.querySelector('.escena__rotulos');
    var neon = escena.querySelector('.neon-sitio');
    var titulo = escena.querySelector('.titulo');
    var img = escena.querySelector('.escena__foto');
    var original = { href: img.getAttribute('href'), vb: svg.getAttribute('viewBox'), w: img.getAttribute('width'), h: img.getAttribute('height') };
    // Cámara (sólo en vertical): 0 = la lámpara entera (mientras se escribe el nombre),
    // 1 = cerca del manómetro (cuando se enciende). La mueve el script de la escena con
    // escena.camara(t); con movimiento reducido, ya cerca.
    var cam = matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 0;
    var suave = function (t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    };
    escena.camara = function (t) {
      cam = t;
      encuadrar();
    };
    function encuadrar() {
      var r = escena.getBoundingClientRect();
      if (!r.width || !r.height) return;
      var vertical = r.width / r.height < v.hasta;
      escena.classList.toggle('escena--vertical', vertical);
      if (vertical) {
        var alto = (v.ancho * r.height) / r.width;
        var techo = v.foto.y;
        var suelo = v.foto.y + v.foto.h;
        // Ancho: la lámpara en el centro de la parte de abajo (deja arriba el sitio del nombre)
        var y0 = Math.min(suelo - alto, Math.max(techo, v.lampara.y - v.lampara.en * alto));
        var ancho = [886 - v.ancho / 2, y0, v.ancho, alto];
        // Cerca: el manómetro agrandado, en su sitio de la pantalla
        var w1 = v.ancho / v.zoom;
