<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>instagram → cronovisor</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=DM+Mono&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --bg: #080810; --text: #f0ede8; --muted: rgba(240,237,232,.45); --line: rgba(240,237,232,.12); --cyan: #6ef9f5; --gold: #ffd166; --green: #b8f75b; --red: #ff3f3f; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; font-size: 12px; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(8,8,16,.94); border-bottom: 1px solid var(--line); padding: 14px 22px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  h1 { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300; font-size: 26px; margin-right: 10px; }
  .muted { color: var(--muted); }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 1px solid var(--line); padding: 7px 11px; cursor: pointer; letter-spacing: .12em; text-transform: uppercase; font-size: 10px; }
  button:hover { border-color: rgba(240,237,232,.4); }
  button.go { border-color: var(--cyan); color: var(--cyan); }
  button:disabled { opacity: .35; cursor: default; }
  input[type=password], input[type=text], input[type=date] { background: rgba(240,237,232,.05); border: 1px solid var(--line); padding: 6px 8px; outline: none; }
  #years { display: flex; gap: 6px; flex-wrap: wrap; }
  #years a { color: var(--muted); text-decoration: none; }
  #years a:hover { color: var(--text); }
  #status { flex-basis: 100%; color: var(--muted); }
  main { padding: 10px 22px 80px; }
  h2 { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300; font-size: 44px; margin: 34px 0 4px; }
  h3 { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 5px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .card { border: 1px solid var(--line); position: relative; transition: opacity .2s; }
  .card.off { opacity: .35; }
  .card img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: #11111f; cursor: pointer; }
  .card .f { padding: 7px; display: flex; flex-direction: column; gap: 5px; }
  .card input[type=text], .card input[type=date] { width: 100%; font-size: 11px; }
  .card .pick { position: absolute; top: 7px; left: 7px; width: 18px; height: 18px; accent-color: var(--cyan); }
  .tags { display: flex; gap: 5px; flex-wrap: wrap; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; }
  .tags span { padding: 2px 5px; border: 1px solid var(--line); color: var(--muted); }
  .tags .text { color: var(--gold); border-color: rgba(255,209,102,.4); }
  .state { position: absolute; top: 6px; right: 8px; font-size: 18px; }
  .card.done { opacity: .5; }
  .card.done .state::after { content: '✓'; color: var(--green); }
  .card.busy .state::after { content: '…'; }
  .card.fail { border-color: var(--red); }
  .card .err { color: var(--red); font-size: 10px; }
  .full { font-family: 'Cormorant Garamond', serif; font-size: 14px; line-height: 1.3; color: var(--muted); max-height: 0; overflow: hidden; transition: max-height .3s; white-space: pre-wrap; }
  .card.open .full { max-height: 400px; }
</style>
</head>
<body>
<header>
  <h1>instagram → cronovisor</h1>
  <span id="count" class="muted"></span>
  <button id="all">all</button><button id="none">none</button>
  <span style="flex:1"></span>
  <input type="password" id="pass" placeholder="admin password" autocomplete="off">
  <button class="go" id="upload" disabled>upload</button>
  <div id="years"></div>
  <div id="status">gold = year taken from the text (posted later) · click a photo to read its whole text · videos left out</div>
</header>
<main id="main"></main>
<script type="module">
  const $ = (id) => document.getElementById(id);
  const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const { items, done, target } = await fetch('/items.json').then((r) => r.json());
  const today = new Date().toISOString().slice(0, 10);
  items.forEach((it) => { it.on = !it.archived && !done[it.id]; it.state = done[it.id] ? 'done' : ''; });

  function render() {
    const main = $('main');
    main.replaceChildren();
    const years = [...new Set(items.map((i) => i.fecha.slice(0, 4)))];
    $('years').innerHTML = years.map((y) => `<a href="#y${y}">${y}</a>`).join(' · ');
    for (const y of years) {
      const h = document.createElement('h2'); h.id = 'y' + y; h.textContent = y; main.append(h);
      const inYear = items.filter((i) => i.fecha.startsWith(y));
      for (const m of [...new Set(inYear.map((i) => i.fecha.slice(5, 7)))]) {
        const list = inYear.filter((i) => i.fecha.slice(5, 7) === m);
        const h3 = document.createElement('h3'); h3.textContent = `${MONTHS[+m - 1]} ${y} · ${list.length}`; main.append(h3);
        const grid = document.createElement('div'); grid.className = 'grid';
        grid.append(...list.map(card));
        main.append(grid);
      }
    }
    tally();
  }
  function card(it) {
    const el = document.createElement('div');
    el.className = 'card' + (it.on ? '' : ' off') + (it.state ? ' ' + it.state : '');
    el.innerHTML = `<img loading="lazy" alt=""><input type="checkbox" class="pick"><span class="state"></span>
      <div class="f"><input type="date"><input type="text" maxlength="300" placeholder="title"><div class="tags"></div><div class="full"></div><div class="err"></div></div>`;
    el.querySelector('img').src = '/img?f=' + encodeURIComponent(it.file);
    const [date, cap] = el.querySelectorAll('.f input');
    const pick = el.querySelector('.pick');
    date.value = it.fecha; date.max = today; cap.value = it.caption; pick.checked = it.on; pick.disabled = it.state === 'done'; date.disabled = cap.disabled = it.state === 'done';
    const tags = [];
    if (it.fromText) tags.push(`<span class="text">year from text · posted ${it.postedOn}</span>`);
    if (it.carousel) tags.push(`<span>${it.carousel}</span>`);
    if (it.archived) tags.push('<span>archived</span>');
    el.querySelector('.tags').innerHTML = tags.join('');
    el.querySelector('.full').textContent = it.full;
    pick.addEventListener('change', () => { it.on = pick.checked; el.classList.toggle('off', !it.on); tally(); });
    date.addEventListener('change', () => { it.fecha = date.value; tally(); });
    cap.addEventListener('input', () => { it.caption = cap.value; });
    el.querySelector('img').addEventListener('click', () => el.classList.toggle('open'));
    it.el = el;
    return el;
  }
  function tally() {
    const todo = items.filter((i) => i.on && i.state !== 'done');
    const months = new Set(todo.map((i) => i.fecha.slice(0, 7)));
    $('count').textContent = `${items.length} photos · ${todo.length} chosen · ${months.size} barrios · ${items.filter((i) => i.state === 'done').length} uploaded`;
    $('upload').disabled = !todo.length || !$('pass').value || todo.some((i) => !/^\d{4}-\d{2}-\d{2}$/.test(i.fecha));
  }
  $('pass').addEventListener('input', tally);
  $('all').addEventListener('click', () => { items.forEach((i) => { if (i.state !== 'done') i.on = true; }); render(); });
  $('none').addEventListener('click', () => { items.forEach((i) => { if (i.state !== 'done') i.on = false; }); render(); });
  $('upload').addEventListener('click', async () => {
    const todo = items.filter((i) => i.on && i.state !== 'done').sort((a, b) => a.fecha.localeCompare(b.fecha));
    $('upload').disabled = true;
    let ok = 0, failed = 0;
    for (const [k, it] of todo.entries()) {
      it.el.className = 'card busy';
      $('status').textContent = `uploading ${k + 1} / ${todo.length} → ${target}`;
      try {
        const r = await fetch('/upload', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Auth': $('pass').value }, body: JSON.stringify({ id: it.id, fecha: it.fecha, caption: it.caption }) });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || r.status);
        it.state = 'done'; it.el.className = 'card done'; ok++;
      } catch (e) {
        it.el.className = 'card fail'; it.el.querySelector('.err').textContent = e.message; failed++;
        if (/unauthorized|rate limited/.test(e.message)) { $('status').textContent = `stopped: ${e.message}`; break; }
      }
    }
    if (!/stopped/.test($('status').textContent)) $('status').textContent = `${ok} uploaded${failed ? ` · ${failed} failed (red), upload again to retry` : ''} · open ezeangeloni.xyz to see the barrios`;
    tally();
  });
  render();
</script>
</body>
</html>
